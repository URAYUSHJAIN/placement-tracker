<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track your placement applications with ease. Manage deadlines, statuses, and follow-ups all in one place." />
  <meta name="theme-color" content="#6359c9" />
  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
  <title>Placement Tracker — Ayush</title>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo-dot">AJ</div>
      <div>
        <h1>Placement Tracker</h1>
        <div class="header-sub">Ayush Jain • ABES EC 2027</div>
      </div>
    </div>
    <div class="header-right">
      <button id="installBtn" style="display: none">⬇️ Install App</button>
      <button class="export-btn" onclick="window.exportData()">⬇ Export JSON</button>
      <button class="export-btn" onclick="window.importData()">⬆ Import</button>
      <button class="add-btn" onclick="window.openEntryModal()">＋ Add Entry</button>
    </div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="filter-bar">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="pending">Pending</button>
    <button class="filter-chip" data-filter="applied">Applied</button>
    <button class="filter-chip" data-filter="assessment">Assessment</button>
    <button class="filter-chip" data-filter="interview">Interview</button>
    <button class="filter-chip" data-filter="offer">Offer</button>
    <button class="filter-chip" data-filter="rejected">Rejected</button>
    <button class="filter-chip" data-filter="overdue" style="margin-left: 8px">🔴 Overdue</button>
    <input class="search-input" id="searchInput" placeholder="Search company / role..." />
  </div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <!-- ADD/EDIT MODAL -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="window.closeModal()">✕</button>
      <h2 id="modalTitle">New Application</h2>

      <div class="form-row">
        <div class="form-group">
          <label>Company Name *</label>
          <input id="fCompany" placeholder="e.g. Sarvam AI" />
        </div>
        <div class="form-group">
          <label>Role *</label>
          <input id="fRole" placeholder="e.g. SDE Intern" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="fStatus">
            <option value="pending">Pending (Not Applied)</option>
            <option value="applied">Applied</option>
            <option value="assessment">Assessment</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deadline / Test Date</label>
          <input id="fDeadline" type="date" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Portal / Apply Link</label>
          <input id="fLink" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label>CTC / Stipend</label>
          <input id="fCTC" placeholder="e.g. ₹8 LPA or ₹20k/mo" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Source (How you found it)</label>
          <input id="fSource" placeholder="LinkedIn / Referral / Campus..." />
        </div>
        <div class="form-group">
          <label>Referral Contact</label>
          <input id="fReferral" placeholder="Name / Username" />
        </div>
      </div>

      <div class="form-group">
        <label>Login / Credentials (Portal)</label>
        <input id="fCreds" placeholder="ayush@gmail.com / auto-login..." />
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="fNotes" placeholder="Bond conditions, test tech stack, interview rounds, contact person..."></textarea>
      </div>

      <div class="form-group">
        <label>Screenshots / Proof of Application</label>
        <div class="drop-zone" id="dropZone">
          <div class="drop-zone-text">
            📎 <span>Click to upload</span> or paste (Ctrl+V) or drag & drop<br />
            <small style="font-size: 11px">Screenshots, confirmation emails, offer letters — PNG/JPG/PDF</small>
          </div>
          <div class="previews" id="previewsContainer"></div>
        </div>
        <input type="file" id="fileInput" accept="image/*,.pdf" multiple style="display: none" />
      </div>

      <button class="save-btn" onclick="window.saveEntry()">Save Entry</button>
    </div>
  </div>

  <!-- URGENT ALERT TOAST -->
  <div class="alert-toast" id="alertToast">
    <span class="at-icon">🚨</span>
    <div id="alertToastMsg"></div>
    <button class="at-close" onclick="document.getElementById('alertToast').classList.remove('show')">✕</button>
  </div>

  <!-- IMAGE VIEWER -->
  <div class="img-viewer" id="imgViewer" onclick="window.closeViewer()">
    <button class="img-viewer-close">✕</button>
    <img id="viewerImg" src="" alt="screenshot" />
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
